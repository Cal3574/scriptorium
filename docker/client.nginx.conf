# Scriptorium client - static SPA served by nginx.
#
# Dropped in at /etc/nginx/conf.d/default.conf, replacing the stock server
# block. Listens on 8080 so the container can run as a non-root user
# (nginxinc/nginx-unprivileged).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly - the JS bundle is the bulk of the
    # transfer and is highly compressible.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed build output (assets/app.4f3a1c.js) - the name changes
    # whenever the bytes change, so it is safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The app shell is the one file that keeps a stable URL, so it must never
    # be served stale - always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # react-router does the routing. Any path that is not a real file falls
    # back to the shell, which boots the router and renders the right view.
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # k8s liveness/readiness probe target - no body, just a 200.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
