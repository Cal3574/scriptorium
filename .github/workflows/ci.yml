name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  DATABASE_URL: postgres://scriptorium:scriptorium@localhost:5432/scriptorium
  REDIS_URL: redis://localhost:6379

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scriptorium
          POSTGRES_PASSWORD: scriptorium
          POSTGRES_DB: scriptorium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scriptorium -d scriptorium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Derive nx affected base
        uses: nrwl/nx-set-shas@v4

      - name: Check formatting
        run: pnpm exec nx format:check

      - name: Check TS project references are in sync
        run: pnpm exec nx sync:check

      - name: Lint
        run: pnpm exec nx run-many -t lint

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck

      - name: Unit tests
        run: pnpm exec nx affected -t test

      - name: Migrate database
        run: pnpm exec nx run database:migrate

      - name: Integration tests
        run: pnpm exec nx run-many -t test-integration

      - name: Build
        run: pnpm exec nx run-many -t build
