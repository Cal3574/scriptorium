# The ArgoCD Application that owns the whole Scriptorium deployment. Apply it
# once, into the `argocd` namespace, against a cluster that already runs
# ArgoCD:
#
#   kubectl apply -n argocd -f argocd/application.yaml
#
# From then on ArgoCD watches `k8s/` on the main branch (rendered with
# kustomize - see k8s/kustomization.yaml) and keeps the cluster matching it
# (prune + selfHeal). The Release workflow bumps the image tags in that
# kustomization on every merge, which is what triggers a rollout. The real
# Secrets are applied out of band and never live in git - see
# k8s/shared/secret.example.yaml and k8s/postgres/secret.example.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scriptorium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Cal3574/scriptorium.git
    targetRevision: main
    # A kustomization.yaml here makes ArgoCD render with kustomize. Only the
    # manifests it lists are deployed - the *.example.yaml Secret templates
    # are left out by omission.
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scriptorium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # k8s/namespace.yaml creates the namespace; no need for ArgoCD to.
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
