<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Scriptorium</title>
    <meta
      name="description"
      content="Turn the books you read into chapter-by-chapter summaries you can search and question across your whole library."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://scriptorium-ai.com/" />
    <!-- Matches the pre-paint theme below: light --background / dark --background. -->
    <meta
      name="theme-color"
      content="#f8f8f9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e0f13"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scriptorium" />
    <meta property="og:title" content="Scriptorium" />
    <meta
      property="og:description"
      content="Turn the books you read into chapter-by-chapter summaries you can search and question across your whole library."
    />
    <meta property="og:url" content="https://scriptorium-ai.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Scriptorium" />
    <meta
      name="twitter:description"
      content="Turn the books you read into chapter-by-chapter summaries you can search and question across your whole library."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <script>
      // Pre-paint theme: runs before the module bundle and any remote, so the
      // first frame is already the right scheme (no flash). Mirror of
      // resolveInitialTheme() in src/theme.tsx. See scriptorium#53.
      (function () {
        try {
          var s = localStorage.getItem('scriptorium-theme');
          var dark =
            s === 'dark' ||
            (!s && matchMedia('(prefers-color-scheme: dark)').matches);
          var e = document.documentElement;
          e.classList.toggle('dark', dark);
          e.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
