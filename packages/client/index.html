<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Scriptorium</title>
    <meta
      name="description"
      content="Turn the books you read into chapter-by-chapter summaries you can search and question across your whole library."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://scriptorium-ai.com/" />
    <meta name="theme-color" content="#11121a" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scriptorium" />
    <meta property="og:title" content="Scriptorium" />
    <meta
      property="og:description"
      content="Turn the books you read into chapter-by-chapter summaries you can search and question across your whole library."
    />
    <meta property="og:url" content="https://scriptorium-ai.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Scriptorium" />
    <meta
      name="twitter:description"
      content="Turn the books you read into chapter-by-chapter summaries you can search and question across your whole library."
    />

    <script>
      // Pre-paint theme: named schemes are canonical on data-theme.
      // `.dark` is mirrored only for compatibility with existing selectors.
      (function () {
        try {
          var s = localStorage.getItem('scriptorium-theme');
          var theme =
            s === 'light'
              ? 'lattice-light'
              : s === 'dark'
                ? 'poimandres'
                : s || 'poimandres';
          var dark = theme !== 'lattice-light';
          var e = document.documentElement;
          e.dataset.theme = theme;
          e.classList.toggle('dark', dark);
          e.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
