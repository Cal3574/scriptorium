# Scriptorium client - the built SPA served by nginx (nginxinc/nginx-
# unprivileged, listening on 8080 as a non-root user). Fully static: the API
# URL and the Clerk publishable key are baked into the bundle at image-build
# time, so this pod takes no env and no shared config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: scriptorium
  annotations:
    # Roll after Postgres/Redis (wave 0) and the migrator (wave 1).
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: client
    spec:
      # Private GHCR packages; `ghcr-pull` Secret created out of band (see
      # k8s/README.md).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: client
          image: ghcr.io/cal3574/scriptorium-client:latest # tag set by k8s/kustomization.yaml; CI bumps it per release
          ports:
            - name: http
              containerPort: 8080
          # `location = /healthz` in docker/client.nginx.conf returns a bare
          # 200.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
