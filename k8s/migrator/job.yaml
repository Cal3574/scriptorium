# Schema migration - runs drizzle migrations against the cluster Postgres,
# then exits. Pods never migrate on boot (see docker/migrator.Dockerfile), so
# this Job is the only writer of the schema.
#
# ArgoCD runs it as a Sync hook in sync-wave 1: Postgres and Redis (wave 0)
# are created and become healthy first, then this Job runs to completion,
# then the api/worker/client Deployments (wave 2) roll. It cannot be a
# PreSync hook - PreSync runs before ANY resource in the app, including
# Postgres, so the Job would wait forever for a database that has not been
# created yet.
#
# `hook-delete-policy: BeforeHookCreation` deletes the previous Job object
# just before the next run (Jobs are immutable, so re-applying in place would
# fail). Idempotent - drizzle skips already-applied migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrator
  namespace: scriptorium
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 3
  # Kubernetes reaps the finished Job (and its pod) after an hour, for the
  # non-ArgoCD path (`kubectl apply -f k8s/migrator/job.yaml`).
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: migrator
    spec:
      restartPolicy: Never
      # Private GHCR packages; `ghcr-pull` Secret created out of band (see
      # k8s/README.md).
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']
      containers:
        - name: migrator
          image: ghcr.io/cal3574/scriptorium-migrator:latest # tag set by k8s/kustomization.yaml; CI bumps it per release
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
