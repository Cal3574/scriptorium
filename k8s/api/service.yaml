# In-cluster address for the api. The Ingress routes `/api` and `/health`
# here; nothing else talks to it. ClusterIP - external traffic arrives only
# through k8s/ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: scriptorium
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
