# Scriptorium API - NestJS HTTP server on port 3000. Stateless: scale by
# raising `replicas`. Config comes entirely from the two shared objects -
# `app-config` (ConfigMap, non-secret) and `app-secrets` (Secret) - so the
# pod spec carries no literal values. `@scriptorium/config` validates the
# merged environment once at boot and exits non-zero on a missing key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: scriptorium
  annotations:
    # Roll after Postgres/Redis (wave 0) and the migrator (wave 1).
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      # Pull from GHCR; the packages are private. The `ghcr-pull` Secret is
      # created out of band, once per namespace (see k8s/README.md).
      imagePullSecrets:
        - name: ghcr-pull
      # The schema migration is a separate pre-deploy Job (k8s/migrator). This
      # only waits for Postgres to accept TCP so a rescheduled pod does not
      # crash-loop while the DB is still coming up.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']
      containers:
        - name: api
          image: ghcr.io/cal3574/scriptorium-api:latest # tag set by k8s/kustomization.yaml; CI bumps it per release
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # `GET /health` sits outside the /api/v1 prefix (see api main.ts).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
