# TEMPLATE - do not apply this file directly and do not put real values in it.
#
# Copy to k8s/shared/secret.yaml (gitignored), fill in the real values, and
# apply it out of band, once per cluster:
#
#   cp k8s/shared/secret.example.yaml k8s/shared/secret.yaml
#   # edit k8s/shared/secret.yaml
#   kubectl apply -f k8s/shared/secret.yaml
#
# ArgoCD is told to skip *.example.yaml (see argocd/application.yaml), so the
# real Secret is the only one that ever reaches the cluster. `stringData`
# takes plain UTF-8 - Kubernetes base64-encodes it on write. base64 is not
# encryption; a committed-and-encrypted flow (Sealed Secrets / SOPS) is the
# planned follow-up.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: scriptorium
type: Opaque
stringData:
  # Points at the in-cluster Postgres Service. The password must match
  # POSTGRES_PASSWORD in k8s/postgres/secret.yaml.
  DATABASE_URL: postgres://scriptorium:REPLACE_ME@postgres:5432/scriptorium
  # In-cluster Redis Service. No auth on Redis (not exposed outside the
  # cluster), so no password segment.
  REDIS_URL: redis://redis:6379
  # Clerk - server-side token verification.
  CLERK_SECRET_KEY: sk_live_REPLACE_ME
  # PEM public key from the Clerk dashboard (API keys -> Show JWT public key).
  # Real newlines inside the block scalar, not \n escapes.
  CLERK_JWT_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_ME
    -----END PUBLIC KEY-----
  # Provider keys - required because PROVIDER_MODE=live.
  OPENAI_API_KEY: REPLACE_ME
  ANTHROPIC_API_KEY: REPLACE_ME
  # Scoped IAM user that signs presigned PUTs and HEAD/DELETEs upload objects
  # (docs/s3-setup.md step 3). Used by both api and worker.
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
