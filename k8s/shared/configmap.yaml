# Non-secret config shared by api and worker. Plain key/value, visible to
# anyone with cluster read access - nothing sensitive goes here (see
# shared/secret.example.yaml for that).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: scriptorium
data:
  NODE_ENV: production
  # live = real docling-serve / OpenAI / Claude adapters and real S3. This is
  # a real deployment, so it is never `fake`. `live` also makes the provider
  # keys and the S3 keys in shared/secret.yaml required at startup.
  PROVIDER_MODE: live
  # Base URL of the self-hosted docling-serve instance (a separate Railway
  # deployment, not in this cluster). Auth is DOCLING_API_KEY in
  # shared/secret.yaml.
  DOCLING_URL: https://docling-serve-production-cd18.up.railway.app
  # Production Clerk instance (clerk.scriptorium-ai.com). Safe to expose - it
  # ships in the browser bundle, and is the value the
  # VITE_CLERK_PUBLISHABLE_KEY build arg bakes into the client. The matching
  # sk_live_ key and JWT PEM in shared/secret.yaml MUST be from this same
  # instance.
  CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuc2NyaXB0b3JpdW0tYWkuY29tJA
  # Reader-upload bucket (docs/s3-setup.md). The bucket name and region are
  # not secret; the IAM keys that sign uploads are.
  S3_BUCKET: scriptorium-uploads-prod
  S3_REGION: eu-west-2
  # The api's own public *origin* (used for presigned-callback links and log
  # context) and the single browser origin allowed through CORS / accepted as
  # the Clerk token `azp`. Both are origin-only, no path - the api mounts its
  # routes under /api/v1 itself, and the client appends that prefix to every
  # request. Both must line up with the host in k8s/ingress.yaml.
  API_URL: https://scriptorium-ai.com
  CLIENT_ORIGIN: https://scriptorium-ai.com
