# TEMPLATE - copy to k8s/postgres/secret.yaml (gitignored), fill in, and apply
# out of band:
#
#   kubectl apply -f k8s/postgres/secret.yaml
#
# POSTGRES_PASSWORD here must match the password in DATABASE_URL in
# k8s/shared/secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: scriptorium
type: Opaque
stringData:
  POSTGRES_USER: scriptorium
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: scriptorium
