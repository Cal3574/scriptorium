# Redis - the BullMQ broker for the `ingest` queue. One replica, backed by a
# PersistentVolumeClaim so an in-flight job survives a pod restart
# (appendonly = fsync the AOF). Not a StatefulSet: there is no clustering and
# no stable-identity requirement, just one pod that owns one disk.
#
# strategy: Recreate - the PVC is ReadWriteOnce, so the old pod must release
# it before the new one mounts. A few seconds of broker downtime on a redeploy
# is fine; BullMQ clients reconnect.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: scriptorium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          args: ['redis-server', '--appendonly', 'yes']
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: scriptorium
spec:
  accessModes: ['ReadWriteOnce']
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
